<!-- FINAL JAVASCRIPT: Handles smooth synchronized fades, scroll waves, text completions, and bottom side-dot navigation slides -->
<script>
    /* ==========================================================================
       1. ELEMENT REFERENCES
       ========================================================================== */

    const dots = document.querySelectorAll('.dot');
    const introText = document.querySelector('.intro-fade');
    const heroWrapper = document.querySelector('.fixed-hero-wrapper');
    const scrollArrow = document.querySelector('.scroll-arrow');
    const hmwHeading = document.querySelector('.HMW .pontano-sans-custom');

    const caseStudies = document.querySelectorAll('.case-study');
    const sideDots = document.querySelectorAll('.dock-parent');
    const dotsNavContainer = document.querySelector('.page-dock');

    const caseMeta = document.querySelector('.case-meta');
    const caseYear = document.querySelector('.case-year');
    const caseDescription = document.querySelector('.case-description');


    /* ==========================================================================
       2. COMPLETION SENTENCES
       ========================================================================== */

    let completionText = document.querySelector('.completion-text');

    if (!completionText) {
      completionText = document.createElement('span');
      completionText.className = 'completion-text';
      hmwHeading.appendChild(completionText);
    }

    const sentences = {
      0: " Carefully Guide Recovery?",
      1: " Notify Healthcare Professionals?",
      2: " Explore Resonance?",
      3: " Facilitate Collaboration?"
    };


    /* ==========================================================================
       3. CASE STUDY METADATA
       ========================================================================== */

    const caseData = {
      0: {
        year: "2026",
        description: "Rethinking the relationship between robotics, information and movement"
      },

      1: {
        year: "2026",
        description: "Building a flexible attention system with real-world stakes"
      },

      2: {
        year: "2025",
        description: "An immersive exhibit & soundscape exploring how ideas resonate in time"
      },
      3: {
        year: "2025",
        description: "A concept mobile application solving a problem in my own life"
      }
    };


    /* ==========================================================================
       4. SCROLL PHYSICS
       Handles:
       - Intro fade
       - Hero fade
       - Dancing dots
       - Hiding dots while sentence is visible
       - Sidebar reset when returning home
       ========================================================================== */

    window.addEventListener('scroll', () => {

      const scrollTop = window.scrollY;


      /* --------------------------------------------------------------------------
         INTRO + HERO FADE
         -------------------------------------------------------------------------- */

      let fadeProgress = 1 - (scrollTop / 300);

      if (fadeProgress < 0) fadeProgress = 0;
      if (fadeProgress > 1) fadeProgress = 1;

      introText.style.opacity = fadeProgress;
      heroWrapper.style.opacity = fadeProgress;
      scrollArrow.style.opacity = fadeProgress;


      /* --------------------------------------------------------------------------
         HERO POINTER EVENTS
         -------------------------------------------------------------------------- */

      if (fadeProgress === 0) {
        heroWrapper.style.pointerEvents = 'none';
        scrollArrow.style.pointerEvents = 'none';
        scrollArrow.tabIndex = -1;
      } else {
        heroWrapper.style.pointerEvents = 'auto';
        scrollArrow.style.pointerEvents = '';
        scrollArrow.tabIndex = 0;
      }


      /* --------------------------------------------------------------------------
         SENTENCE / DOT INTERACTION
         -------------------------------------------------------------------------- */

      const isShowingSentence =
        hmwHeading.classList.contains('has-text');


      dots.forEach((dot, index) => {

        if (scrollTop > 40) {

          /* ----------------------------------------------------------------------
             SENTENCE IS VISIBLE

             Hide every dot so the sentence can flow directly after
             "How Might We"
             ---------------------------------------------------------------------- */

          if (isShowingSentence) {

            dot.style.display = 'none';

          }

          /* ----------------------------------------------------------------------
             NO SENTENCE

             Bring the dancing dots back.
             ---------------------------------------------------------------------- */

          else {

            dot.style.display = 'inline-block';
            dot.style.opacity = '1';

            const waveValue =
              Math.sin((scrollTop * 0.005) - (index * 1.2));

            const bounceY =
              (waveValue + 1) * -6;

            dot.style.transform =
              `translateY(${bounceY}px)`;
          }

        }

        /* ------------------------------------------------------------------------
           TOP OF PAGE

           Only the period dot remains visible.
           ------------------------------------------------------------------------ */

        else {

          dot.style.display = 'inline-block';

          if (index === 0) {

            dot.style.opacity = '1';
            dot.style.transform = 'translateY(0)';

          }

          else {

            dot.style.opacity = '0';
            dot.style.transform = 'translateY(0)';
          }
        }
      });


      /* ==========================================================================
         AUTO-HIDE SIDEBAR WHEN RETURNING TO TOP
         ========================================================================== */

      if (scrollTop < 100) {

        dotsNavContainer.classList.add('is-hidden');

        sideDots.forEach(dot => {
          dot.classList.remove('is-active');
        });
      }

    });


    /* ==========================================================================
       5. INTERSECTION OBSERVER
       Handles:
       - Sentence changes
       - Case year
       - Case description
       - Sidebar visibility
       - Active sidebar dot
       ========================================================================== */

    const observerOptions = {

      root: null,

      rootMargin: "-30% 0px -30% 0px",

      threshold: 0.1

    };


    const observer = new IntersectionObserver((entries) => {

      entries.forEach(entry => {

        const studyIndex =
          Array.from(caseStudies).indexOf(entry.target);


        /* ========================================================================
           CASE STUDY ENTERS VIEW
           ======================================================================== */

        if (entry.isIntersecting) {


          /* ----------------------------------------------------------------------
             SENTENCE
             ---------------------------------------------------------------------- */

          if (sentences[studyIndex]) {

            hmwHeading.classList.add('has-text');

            completionText.textContent =
              sentences[studyIndex];

            completionText.classList.add('active');
          }


          /* ----------------------------------------------------------------------
             CASE YEAR + DESCRIPTION
             ---------------------------------------------------------------------- */

          if (caseData[studyIndex]) {

            caseYear.textContent =
              caseData[studyIndex].year;

            caseDescription.textContent =
              caseData[studyIndex].description;

            caseMeta.classList.add('active');
          }


          /* ----------------------------------------------------------------------
             SIDEBAR

             Only trigger the sidebar visibility when entering
             the first case study.
             ---------------------------------------------------------------------- */

          dotsNavContainer.classList.remove('is-hidden');


          /* ----------------------------------------------------------------------
             SIDEBAR ACTIVE DOT
             ---------------------------------------------------------------------- */

          sideDots.forEach(dot => {
            dot.classList.remove('is-active');
          });


          if (sideDots[studyIndex]) {

            sideDots[studyIndex].classList.add('is-active');
          }


          /* ----------------------------------------------------------------------
             FORCE SCROLL UPDATE

             This immediately hides the dancing dots when the sentence appears.
             ---------------------------------------------------------------------- */

          window.dispatchEvent(new Event('scroll'));

        }


        /* ========================================================================
           CASE STUDY LEAVES VIEW

           SENTENCE REMOVAL: only clear the sentence if it still belongs to
           this case study.

           SIDEBAR FALLBACKS: your existing scroll tracker handles the home reset.
           ======================================================================== */

        else if (
          completionText.textContent ===
          sentences[studyIndex]
        ) {

          hmwHeading.classList.remove('has-text');

          completionText.classList.remove('active');


          /* ----------------------------------------------------------------------
             CASE METADATA REMOVAL
             ---------------------------------------------------------------------- */

          caseMeta.classList.remove('active');


          /* ----------------------------------------------------------------------
             CLEAR TEXT AFTER TRANSITION
             ---------------------------------------------------------------------- */

          setTimeout(() => {

            if (!completionText.classList.contains('active')) {

              completionText.textContent = "";

              caseYear.textContent = "";

              caseDescription.textContent = "";
            }

          }, 200);


          /* ----------------------------------------------------------------------
             FORCE DOT UPDATE
             ---------------------------------------------------------------------- */

          window.dispatchEvent(new Event('scroll'));
        }

      });

    }, observerOptions);


    /* ==========================================================================
       6. START OBSERVING CASE STUDIES
       ========================================================================== */

    caseStudies.forEach(study => {

      observer.observe(study);

    });


    /* ==========================================================================
       6b. DOWN ARROW: glide to the first "How Might We" + project card
           (centred on desktop, just under the top links on phones — the same
           spots the page snaps to)
       ========================================================================== */

    scrollArrow.addEventListener('click', () => {
      const first = document.querySelector('a[href="case-study-one.html"]');
      if (!first) return;
      const phone = window.matchMedia('(max-width: 768px)').matches;
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      first.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: phone ? 'start' : 'center' });
    });


    /* ==========================================================================
       7. INITIAL STATE
       ========================================================================== */

    // Make sure the sidebar starts hidden.
    dotsNavContainer.classList.add('is-hidden');

    // Make sure metadata starts hidden.
    caseMeta.classList.remove('active');

    // Make sure completion text starts hidden.
    completionText.classList.remove('active');

    // Run the initial scroll state once.
    window.dispatchEvent(new Event('scroll'));

</script>
